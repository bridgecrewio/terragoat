name: build
# DISABLED: This workflow uses unpinned third-party actions (checkov-action@master).
# Trigger changed to manual-only. See assessment module 02 for full analysis.
on:
  workflow_dispatch:
jobs:
  checkov-job:
    runs-on: ubuntu-latest
    name: checkov-action
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Run Checkov action
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
